name: Daily EV search

on:
  schedule:
    # 13:00 UTC = 7am MDT / 6am MST (zip 84015)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print new listings instead of notifying/saving"
        type: boolean
        default: false

permissions:
  contents: write # push updated seen_listings.json

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure a browser is available
        # Runners ship Google Chrome at /usr/bin/google-chrome, which
        # browser_fetch._find_chrome() picks up first. Fall back to
        # Playwright Chromium if the image ever drops it.
        run: |
          if [ ! -x /usr/bin/google-chrome ]; then
            python -m playwright install --with-deps chromium
          fi

      - name: Run search
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Autotrader is bot-blocked without an unlocker (see README);
          # skip it until Bright Data or similar is wired in.
          ENABLE_AUTOTRADER: "false"
          # Empty on scheduled runs, which the && short-circuits to 'false'.
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        # nodriver runs headless=False, so give it a virtual display.
        # The throwaway Chrome launch warms cold-runner caches so the
        # first nodriver connect doesn't time out (see browser_fetch.py).
        run: |
          sudo apt-get install -y xvfb
          timeout 30 google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --dump-dom about:blank > /dev/null 2>&1 || true
          xvfb-run -a python src/main.py

      - name: Commit updated seen listings
        run: |
          git add seen_listings.json
          if git diff --cached --quiet; then
            echo "No new listings; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update seen listings ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
